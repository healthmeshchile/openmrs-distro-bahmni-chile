name: Build and Publish OpenMRS
on:
  push:
    branches:
      - master
      - 'release-*'
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
    paths-ignore:
      - "**.md"
  workflow_dispatch:

jobs:
  build-publish-docker-helm:
    name: Build & Publish Docker Image & Helm Chart
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read     # resolver los omod de Chile desde GitHub Packages
    env:
      HELM_CHART_PATH: package/helm/openmrs
    steps:
      - uses: actions/checkout@v2
      - name: Set env.ARTIFACT_VERSION
        run: |
          wget -q https://raw.githubusercontent.com/Bahmni/bahmni-infra-utils/main/setArtifactVersion.sh && chmod +x setArtifactVersion.sh
          ./setArtifactVersion.sh
          rm setArtifactVersion.sh
      - name: Set up JDK 1.8
        uses: actions/setup-java@v1
        with:
          java-version: 1.8
      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      # Los modulos de Chile viven en GitHub Packages, que sirve por repositorio y
      # exige credenciales aunque no haya nada publico. Hay un <server> por cada
      # <repository> del distro/pom.xml, con el mismo <id>.
      #
      # Se usa el GITHUB_TOKEN del propio workflow, que esta acotado a este
      # repositorio: para que alcance a los paquetes de los otros seis hay que
      # concederle acceso UNA vez por paquete, en la pagina del paquete ->
      # "Manage Actions access" -> anadir openmrs-distro-bahmni-chile con Read.
      # Si algun dia estorba, la alternativa es un PAT con read:packages en un
      # secreto; se prefiere no tenerlo porque un PAT no caduca con el job.
      - name: Credenciales de GitHub Packages
        run: |
          mkdir -p ~/.m2
          {
            echo '<settings><servers>'
            for id in ghp-bahmni-core-chile ghp-appointments-chile ghp-oauth2login \
                      ghp-eis-identity ghp-interconsulta ghp-provider-signature; do
              echo "  <server><id>${id}</id><username>${GH_ACTOR}</username><password>${GH_TOKEN}</password></server>"
            done
            echo '</servers></settings>'
          } > ~/.m2/settings.xml
        env:
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build with Maven
        run: |
          ./mvnw --no-transfer-progress -U clean install
        env:
          USER_NAME: ${{ secrets.USERNAME }}
          ACCESS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
      - name: Docker Build and push
        uses: docker/build-push-action@v3
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          file: package/docker/openmrs/Dockerfile
          push: true
          tags: healthmeshgroup/openmrs-hm:${{ env.ARTIFACT_VERSION }},healthmeshgroup/openmrs-hm:latest
      - name: Update Version and Image Tag
        run: |
          yq --inplace '.image.tag = "${{ env.ARTIFACT_VERSION }}"' $HELM_CHART_PATH/values.yaml
          yq --inplace '.version = "${{ env.ARTIFACT_VERSION }}"' $HELM_CHART_PATH/Chart.yaml
      - name: Helm Lint
        run: helm lint $HELM_CHART_PATH

      - name: Helm Package
        run: helm package $HELM_CHART_PATH

      # Chart como artefacto OCI, al mismo registro que las imagenes.
      #
      # SUSTITUYE al modelo de Bahmni (gh-pages + 'helm repo index'), que sirve el
      # repositorio de charts como sitio web y por tanto exige que sea PUBLICO:
      # GitHub Pages no publica repositorios privados. Con OCI la visibilidad se
      # controla por artefacto y no hacen falta ni gh-pages ni index.yaml.
      #
      # El nombre del repositorio OCI lo deriva helm del <name> del Chart.yaml. Por eso
      # el chart se llama 'openmrs-hm-chart' y no igual que la imagen: ambos usan la
      # MISMA ARTIFACT_VERSION, asi que compartir repositorio haria que la etiqueta de
      # uno sobrescribiera la del otro.
      - name: Publicar el chart como artefacto OCI
        env:
          DOCKER_USER: ${{ secrets.DOCKER_HUB_USERNAME }}
          DOCKER_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
        run: |
          tgz=$(ls -1 *.tgz | head -1)
          if [ -z "$tgz" ]; then echo 'no se empaqueto ningun chart'; exit 1; fi
          echo "$DOCKER_TOKEN" | helm registry login registry-1.docker.io -u "$DOCKER_USER" --password-stdin
          helm push "$tgz" oci://registry-1.docker.io/healthmeshgroup
